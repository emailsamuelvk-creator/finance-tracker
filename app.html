<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Household Budget</title>
<meta name="hb-app" content="household-budget">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first column. Purple gradient header with sub-tabs, month card, colorful cards, floating bottom nav for the 3 main tabs. */
:root{
  --bg:#f3f2f8; --surface:#ffffff; --surface-2:#f1eff7; --ink:#1b1530; --muted:#8a8597; --line:#ebe8f2;
  --h1:#b14cf5; --h2:#7a2cf2; --hfg:#ffffff;
  --lav:#efe2fd; --lav-2:#dcc2fb; --lav-ink:#5b2aa8;
  --c-food:#5b9bf0; --c-transport:#8b4deb; --c-ent:#ee6fb5; --c-gifts:#2ec4a0; --c-util:#f5a33b; --c-house:#a3c93a; --c-grey:#5e5e66;
  --spent:#f58fb3; --saved:#3dcba5; --total:#b98af0; --bad:#e5484d;
  --font:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121019; --surface:#1c1826; --surface-2:#262133; --ink:#f1edf8; --muted:#a29cb2; --line:#2e2840;
  --lav:#37285a; --lav-2:#4d3580; --lav-ink:#e2d1ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121019; --surface:#1c1826; --surface-2:#262133; --ink:#f1edf8; --muted:#a29cb2; --line:#2e2840;
  --lav:#37285a; --lav-2:#4d3580; --lav-ink:#e2d1ff; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--h2)}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--h1);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.dh{width:.82em;height:.82em;vertical-align:-.06em;margin-right:.14em;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

header{position:relative;background:linear-gradient(160deg,var(--h1),var(--h2));color:var(--hfg);padding:14px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.hin{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;align-items:center}
.htitle{font-weight:500;font-size:1.05rem;opacity:.95}
.htitle b{font-weight:700}
.subtabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.subtabs button{border:0;background:transparent;color:var(--hfg);opacity:.9;font-weight:700;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;padding:10px 16px;border-radius:999px;cursor:pointer}
.subtabs button[aria-selected="true"]{background:rgba(255,255,255,.2);opacity:1}

.wrap{max-width:560px;margin:-48px auto 0;position:relative;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(40,20,80,.04)}
.monthcard{flex-direction:row;align-items:center;justify-content:space-between;padding:12px 10px;border-radius:999px}
.monthcard div{text-align:center}
.monthcard b{display:block;font-size:1.05rem;font-weight:600}
.monthcard small{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.arrow{border:0;background:transparent;color:var(--muted);font-size:1.6rem;width:40px;height:40px;border-radius:50%;cursor:pointer;line-height:1}
.eyebrow{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.big{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.row2{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}

/* line chart */
.chartbox{position:relative}
.chartbox>svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.tip{position:absolute;top:0;transform:translateX(-50%);background:#14101f;color:#fff;border-radius:12px;padding:8px 11px;font-size:.78rem;white-space:nowrap;pointer-events:none;z-index:2}
.tip b{font-size:1rem;display:block}
.legendline{display:flex;gap:16px;font-size:.8rem;color:var(--muted)}
.legendline span{display:flex;align-items:center;gap:6px}
.legendline i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* quick category circles */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.quick button{border:0;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:4px}
.ring{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring .ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:1.45rem;color:#fff}
.quick small{font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.quick b{font-size:.95rem}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .dow{font-size:.66rem;color:var(--muted);font-weight:700;letter-spacing:.06em;padding-bottom:4px}
.day{--hue:#b14cf5;border:0;background:color-mix(in srgb,var(--hue) 9%,var(--surface));color:color-mix(in srgb,var(--hue) 55%,var(--muted));border-radius:12px;padding:6px 0 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;font-family:inherit}
.day .d{font-size:.76rem;font-weight:600;color:var(--ink)}
.day .a{font-size:.68rem;font-weight:700;display:flex;align-items:center;white-space:nowrap}
.day:not(.has) .a{opacity:.6}
.day.has{background:color-mix(in srgb,var(--hue) 26%,var(--surface));color:color-mix(in srgb,var(--hue) 70%,var(--ink))}
.day.has .d{color:color-mix(in srgb,var(--hue) 55%,var(--ink))}
.cal .dow{color:var(--h2)!important}
.heatkey{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:.7rem;color:var(--muted);font-weight:600}
.heatkey i{width:14px;height:10px;border-radius:3px;display:inline-block}
.day.sel{outline:2px solid var(--h2);outline-offset:-2px}
.day.today .d{color:var(--h2);font-weight:800}
.day.future{opacity:.45}
.day.pad{visibility:hidden}

/* donut + lists */
.donutwrap{display:grid;place-items:center;position:relative}
.donutwrap>svg{width:min(260px,100%);height:auto}
.dcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:none}
.dcenter .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem}
.dcenter b{font-size:1.7rem;font-weight:800}
.dcenter small{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;max-width:150px;text-align:center}
.toggle{display:flex;justify-content:center;gap:6px}
.toggle button{border:0;background:transparent;color:var(--ink);font-size:.7rem;letter-spacing:.12em;font-weight:700;text-transform:uppercase;padding:10px 16px;border-radius:999px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--surface-2)}
.lrow{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);width:100%;padding:8px 0;cursor:pointer;text-align:left;font-size:.95rem}
.lrow .sq{width:11px;height:11px;border-radius:3px;flex:none}
.lrow .nm{white-space:nowrap}
.lrow .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:12px}
.lrow .chev{color:var(--muted);font-size:1.1rem;width:14px;text-align:center}
.lrow.sub{padding-left:22px;font-size:.88rem;color:var(--muted)}
.lrow.sub .nm{color:var(--ink)}
.lrow.zero{opacity:.5}

/* entries */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:6px}
.dayhead b{font-size:1.15rem;font-weight:800}
.dayhead span{color:var(--muted);font-size:.9rem}
.entry{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:7px 0}
.eic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem}
.entry .meta{min-width:0}
.entry .meta div{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .meta small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .amt{font-weight:700;display:flex;align-items:center;gap:6px}
.amt.in{color:var(--saved)}
.del{border:0;background:transparent;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px 6px;border-radius:8px}
.del.confirm{color:var(--bad);font-size:.76rem;font-weight:700;background:color-mix(in srgb,var(--bad) 14%,transparent)}
.clip{border:0;background:var(--surface-2);color:var(--ink);border-radius:8px;padding:3px 6px;cursor:pointer;font-size:.9rem;line-height:1}
.empty{color:var(--muted);text-align:center;padding:14px 8px}

/* forms */
form.add{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.add .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lab{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field input,.field select{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:11px;font:500 1rem var(--font);min-width:0;width:100%}
.btn{border:0;background:linear-gradient(160deg,var(--h1),var(--h2));color:#fff;font:700 1rem var(--font);padding:13px;border-radius:14px;cursor:pointer}
.btn[disabled]{opacity:.6}
.btn.soft{background:var(--surface-2);color:var(--ink);font-size:.88rem;padding:10px 14px;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;padding:9px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.attach{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.attach .fname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}

/* bars */
.bars3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;text-align:center}
.bars3 .col{display:flex;flex-direction:column;align-items:center;gap:8px}
.bars3 .bar{width:48px;border-radius:24px 24px 0 0;min-height:6px}
.bars3 .cap{border-top:1px solid var(--line);padding-top:10px;width:100%}
.bars3 b{font-size:1.05rem;display:flex;justify-content:center;align-items:center}
.bars3 small,.minis small{font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hist{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:150px}
.hist .m{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.hist .pair{display:flex;gap:3px;align-items:flex-end;height:110px}
.hist .pair i{width:12px;border-radius:6px 6px 2px 2px;display:block;min-height:3px}
.hist small{font-size:.68rem;color:var(--muted);font-weight:600}
.hist .m.cur small{color:var(--ink);font-weight:800}

/* savings pots */
.pots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pot{border-radius:18px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.pot small{opacity:.9;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pot b{font-size:1.3rem;font-weight:800;display:flex;align-items:center}
.pot .rm{position:absolute;top:6px;right:6px;border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:99px;font-size:.72rem;font-weight:700;padding:3px 8px;cursor:pointer}
.addpot{display:flex;gap:8px}
.addpot input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:10px;font:500 .95rem var(--font)}
.promo{background:linear-gradient(135deg,#ffd1e8,#f6a6d3 45%,#c9a8f7);color:#1b1530;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:4px}
.promo b{font-size:1.35rem;font-weight:800;line-height:1.2}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.minis div{background:var(--surface-2);border-radius:14px;padding:10px 4px}
.minis b{display:flex;justify-content:center;align-items:center;font-size:.98rem}
.note{font-size:.78rem;color:var(--muted);text-align:center}

/* bottom nav */
nav.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:6px;display:flex;gap:4px;box-shadow:0 8px 30px rgba(60,20,120,.18);width:min(360px,calc(100% - 32px))}
nav.bottom button{flex:1;border:0;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:999px;cursor:pointer;font-size:.74rem;font-weight:600}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-selected="true"]{background:var(--surface-2)}
nav.bottom button[aria-selected="true"] svg{color:var(--h2)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14101f;color:#fff;padding:10px 16px;border-radius:99px;font-weight:600;font-size:.9rem;z-index:20;max-width:calc(100% - 32px);text-align:center}
.viewer{position:fixed;inset:0;z-index:30;background:rgba(10,6,20,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.viewer img{max-width:100%;max-height:78vh;border-radius:12px;background:#fff;object-fit:contain}
.viewer .vbar{display:flex;gap:10px}
.viewer a,.viewer button{background:#fff;color:#14101f;border:0;border-radius:99px;padding:10px 16px;font:700 .95rem var(--font);text-decoration:none;cursor:pointer}
.viewer p{color:#fff;margin:0;text-align:center}
@media (max-width:370px){.day .a{font-size:.6rem}.big{font-size:1.9rem}.ring{width:58px;height:58px}.ring .ic{width:44px;height:44px}}
@media (prefers-reduced-motion:no-preference){.bars3 .bar,.hist .pair i{transition:height .4s ease}}
/* v4 additions: income, editable categories */
:root{--income:#8cc63f}
.bars3{grid-template-columns:repeat(var(--n,3),1fr)}
.bars3 .bar{width:min(48px,100%)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.editbtn{border:0;background:var(--surface-2);color:var(--h2);font:700 .8rem var(--font);padding:8px 14px;border-radius:99px;cursor:pointer}
.editbtn.on{background:linear-gradient(160deg,var(--h1),var(--h2));color:#fff}
.ehead{display:flex;gap:8px;align-items:center;padding-top:14px}
.ecat{display:flex;gap:8px;align-items:center;padding:6px 0 0 18px}
.ehead input,.ecat input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:9px 10px;font:700 .98rem var(--font)}
.ecat input{font-weight:500;font-size:.92rem}
.ecat .em{width:26px;text-align:center;flex:none}
.mini{border:0;background:var(--surface-2);color:var(--bad);border-radius:99px;min-width:34px;height:34px;font:800 1.1rem var(--font);cursor:pointer;flex:none;padding:0 8px}
.mini.confirm{font-size:.74rem;background:color-mix(in srgb,var(--bad) 14%,transparent)}
.addlink{border:0;background:transparent;color:var(--h2);font:700 .9rem var(--font);padding:8px 0 4px 18px;cursor:pointer;text-align:left;align-self:flex-start}
.dhead,.ecat{-webkit-touch-callout:none}
.dhead.dragging,.ecat.dragging{position:fixed;z-index:25;margin:0;background:var(--surface);border-radius:14px;box-shadow:0 10px 30px rgba(60,20,120,.25);pointer-events:none;padding-right:8px}
.ecat.dragging{padding-top:6px;padding-bottom:6px}
.dph{border:2px dashed var(--lav-2);border-radius:12px;margin:6px 0 0 18px;box-sizing:border-box}
.dph.h{margin-left:0;margin-top:14px}
.dzone{min-height:4px}
.dhint{font-size:.76rem;color:var(--muted);margin-top:-4px}
.pressing{opacity:.75;transition:opacity .4s}
#sg td:first-child{overflow:hidden;text-overflow:ellipsis}
.subtabs{gap:2px}
.subtabs button{padding:10px 11px;letter-spacing:.09em}
#sg tr.sgh td{background:color-mix(in srgb,var(--hc) 12%,var(--surface));font-weight:700}
#sg tr.sgs td:first-child{padding-left:22px;color:var(--muted);font-weight:500}
#sg td.yt{font-weight:800;border-left:1px solid var(--line)}
#sg th.yt{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;border-left:1px solid var(--line)}
.upring{background:color-mix(in srgb,var(--h1) 12%,var(--surface));border:2px dashed var(--lav-2)}
.upring .ic{color:var(--h2);background:transparent}
.upring svg{width:24px;height:24px}
.upback{border:0;background:transparent;color:var(--h2);font:700 .95rem var(--font);padding:6px 0;cursor:pointer}
.updrop{border:2px dashed var(--lav-2);background:color-mix(in srgb,var(--h1) 5%,var(--surface));border-radius:16px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--muted);font:500 .84rem var(--font);cursor:pointer;width:100%}
.updrop svg{width:24px;height:24px;color:var(--h2)}
.updrop b{color:var(--ink);font-size:1rem;font-weight:700}
.upfiles{display:flex;flex-wrap:wrap;gap:6px}
.upfile{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:99px;padding:4px 4px 4px 10px;font-size:.84rem;max-width:100%}
.upfile button{border:0;background:transparent;color:var(--muted);font-size:1rem;cursor:pointer;padding:2px 6px}
.uperr{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:.88rem;font-weight:600}
.upbusy{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.upbusy span:nth-child(2){flex:1}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--lav-2);border-top-color:var(--h2);flex:none}
@media (prefers-reduced-motion:no-preference){.spin{animation:spin 1s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.strow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:18px;background:var(--surface-2);border:0;width:100%;text-align:left;color:var(--ink);font-family:inherit;cursor:pointer}
.stic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--lav);font-size:1.2rem}
.sttiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sttiles div{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.sttiles small{display:block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sttiles b{font-size:1rem;font-weight:800}
.sttabs{display:flex;gap:6px;overflow-x:auto;margin:0 -18px;padding:0 18px 2px;-webkit-overflow-scrolling:touch}
.sttabs button{flex:none;border:0;background:var(--surface-2);color:var(--ink);font:600 .8rem var(--font);padding:8px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
.sttabs button[aria-selected="true"]{background:var(--lav);color:var(--lav-ink);font-weight:800}
.stit{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:3px}
.stit:first-child{border-top:0}

function makeFsAssets(db){
  const CH=900000, cache={};
  const toB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(b)});
  return {kind:"fs",
    async upload(blob,o){const type=(o&&o.type)||blob.type||"application/octet-stream", id="f"+Date.now().toString(36)+rid(), b64=await toB64(blob), n=Math.max(1,Math.ceil(b64.length/CH));
      for(let i=0;i<n;i++) await db.doc(`blobs/${id}_${i}`).set({d:b64.slice(i*CH,(i+1)*CH)});
      await db.doc(`blobs/${id}`).set({type,n,size:blob.size,ts:new Date().toISOString()});
      return {id,url:null,contentType:type,sizeBytes:blob.size}},
    async delete(id){const m=await db.doc(`blobs/${id}`).get();const n=m.exists?(m.data().n||1):0;for(let i=0;i<n;i++)await db.doc(`blobs/${id}_${i}`).delete();await db.doc(`blobs/${id}`).delete()},
    async urlFor(id){if(cache[id])return cache[id];const m=await db.doc(`blobs/${id}`).get();if(!m.exists)throw {code:"not_found"};const {type,n}=m.data();let b64="";for(let i=0;i<n;i++){const d=await db.doc(`blobs/${id}_${i}`).get();b64+=d.exists?d.data().d:""}
      const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return cache[id]=URL.createObjectURL(new Blob([u],{type}))},
    async list(){return {assets:[],usage:{}}}
  };
}

function makeLocalStore(){
  const subs={}, single={pots:1,cats:1,merch:1}, key=k=>k+sfx();
  const rd=k=>local.read(key(k),single[k]?null:[]);
  const emit=k=>{const f=subs[key(k)];f&&f(rd(k),{fromCache:false})};
  return {kind:"local",
    watch(k,cb){const kk=key(k);subs[kk]=cb;emit(k);return()=>{if(subs[kk]===cb)delete subs[kk]}},
    async add(k,doc){const a=local.read(key(k),[]);a.push({...doc,id:rid()});local.write(key(k),a);emit(k)},
    async del(k,id){local.write(key(k),local.read(key(k),[]).filter(x=>x.id!==id));emit(k)},
    async set(k,id,doc){const a=local.read(key(k),[]).filter(x=>x.id!==id);a.push({...doc,id});local.write(key(k),a);emit(k)},
    async setPots(p){local.write(key("pots"),{pots:p});emit("pots")},
    async setCats(c){local.write(key("cats"),c);emit("cats")},
    async setMerch(m){local.write(key("merch"),{m});emit("merch")},
  };
}
function makeDbStore(db){
  const col={tx:"txns",inc:"income",sav:"savings",stmt:"statements"}, cfg={pots:"config/pots",cats:"config/categories",merch:"config/merchants"};
  let chain=Promise.resolve(); const serial=fn=>(chain=chain.then(fn,fn));
  return {kind:"db",
    watch(k,cb,err){
      if(cfg[k]) return db.doc(cfg[k]+sfx()).onSnapshot(s=>cb(s.exists?s.data():null,s.metadata),err);
      return db.collection(col[k]+sfx()).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()})),s.metadata),err);
    },
    add(k,doc){return db.collection(col[k]+sfx()).add(doc)},
    del(k,id){return db.doc(col[k]+sfx()+"/"+id).delete()},
    set(k,id,doc){return db.doc(col[k]+sfx()+"/"+id).set(doc)},
    setPots(p){return serial(()=>db.doc("config/pots"+sfx()).set({pots:p}))},
    setCats(c){return serial(()=>db.doc("config/categories"+sfx()).set(c))},
    setMerch(m){return serial(()=>db.doc("config/merchants"+sfx()).set({m}))},
  };
}

function lineChart(m){
  const cur=daily(m), prev=daily(shiftMonth(m,-1)), N=daysIn(m);
  const lastDay = m===thisMonth?+todayStr.slice(8,10):(m>thisMonth?0:N);
  const cum=[0],pc=[0];
  for(let i=1;i<=N;i++){cum[i]=cum[i-1]+cur[i]}
  for(let i=1;i<prev.length;i++){pc[i]=pc[i-1]+prev[i]}
  const W=340,H=150,L=4,R=8,T=14,B=26;
  const maxY=Math.max(1,cum[lastDay]||0,pc[Math.min(N,pc.length-1)]||0);
  const x=i=>L+(i-1)/(N-1)*(W-L-R), y=v=>T+(1-v/maxY)*(H-T-B);
  const pts=a=>a.map((v,i)=>i?`${x(i).toFixed(1)},${y(v).toFixed(1)}`:null).filter(Boolean);
  const curPts=pts(cum.slice(0,lastDay+1)), prevPts=pts(pc.slice(0,Math.min(N,pc.length-1)+1));
  let grid=""; for(let g=1;g<=3;g++){const yy=T+g*(H-T-B)/4;grid+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="3 4"/>`}
  let ticks=""; for(const d of [1,6,11,16,21,26]) if(d<=N) ticks+=`<text x="${x(d)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${d}</text>`;
  const area = curPts.length>1?`<path d="M${curPts[0]} L${curPts.join(" L")} L${x(lastDay)},${H-B} L${x(1)},${H-B} Z" fill="url(#ga)"/>`:"";
  const endDot = lastDay>=1?`<circle cx="${x(lastDay)}" cy="${y(cum[lastDay])}" r="5" fill="var(--h2)" stroke="var(--surface)" stroke-width="2"/>`:"";
  return {svg:`<svg viewBox="0 0 ${W} ${H}" id="lc" role="img" aria-label="Cumulative spending through the month">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#b14cf5" stop-opacity=".32"/><stop offset="1" stop-color="#b14cf5" stop-opacity="0"/></linearGradient></defs>
    ${grid}${prevPts.length>1?`<polyline points="${prevPts.join(" ")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 5" opacity=".55"/>`:""}
    ${area}${curPts.length>1?`<polyline points="${curPts.join(" ")}" fill="none" stroke="var(--h1)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`:""}${endDot}${ticks}
    <line id="lcv" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--h2)" stroke-width="1.5" visibility="hidden"/>
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" id="lchit"/></svg>`,
    meta:{N,lastDay,cur,cum,pc,x,W}};
}
function calendar(m){
  const d=daily(m), N=daysIn(m), [y,mo]=m.split("-").map(Number), first=new Date(y,mo-1,1).getDay();
  const vals=d.slice(1).filter(v=>v>0).sort((a,b)=>a-b);
  const level=v=>{if(!(v>0)) return -1; if(vals.length<2) return 2; const r=vals.filter(x=>x<v).length/(vals.length-1); return Math.min(4,Math.floor(r*5))};
  let h=["SUN","MON","TUE","WED","THU","FRI","SAT"].map(w=>`<div class="dow">${w}</div>`).join("");
  for(let i=0;i<first;i++) h+=`<div class="day pad"></div>`;
  for(let i=1;i<=N;i++){
    const ds=`${m}-${pad(i)}`, v=d[i], lv=level(v);
    const cls=["day", lv>=0?"has":"", ds===todayStr?"today":"", ds>todayStr?"future":"", ds===selDay?"sel":""].join(" ");
    h+=`<button class="${cls}" ${lv>=0?`style="--hue:${HEAT[lv]}"`:""} data-day="${ds}" aria-label="${dayLabel(ds)}: ${ccy()} ${nf(v,2)}"><span class="d">${i}</span><span class="a">${SYM().replace('class="dh"','class="dh" style="width:.75em;height:.75em;margin-right:1px"')}${compact(v)}</span></button>`;
  }
  return `<div class="cal">${h}</div><div class="heatkey">Less ${HEAT.map(c=>`<i style="background:color-mix(in srgb,${c} 45%,var(--surface))"></i>`).join("")} More</div>`;
}

function donut(items,center){
  const total=sum(items,i=>i.v); const r=96,c=2*Math.PI*r; let off=0; const gap=Math.min(10,c*0.02);
  const nz=items.filter(i=>i.v>0);
  const segs=nz.map(i=>{const len=i.v/total*c; const draw=Math.max(0.5,len-(nz.length>1?gap+12:0)); const s=`<circle r="${r}" cx="130" cy="130" fill="none" stroke="${i.color}" stroke-width="20" stroke-linecap="round" stroke-dasharray="${draw} ${c}" stroke-dashoffset="${-(off+(nz.length>1?gap/2+6:0))}" transform="rotate(-90 130 130)"/>`;off+=len;return s}).join("");
  return `<div class="donutwrap"><svg viewBox="0 0 260 260" role="img" aria-label="Split by category"><circle r="${r}" cx="130" cy="130" fill="none" stroke="var(--surface-2)" stroke-width="20"/>${segs}</svg>
    <div class="dcenter">${center}</div></div>`;
}

  const r=parseStatementLines(L,todayStr);
  const tx=r.tx.map(x=>({...x,c:guessCat(x.m)}));
  if(!tx.length) throw {code:"none_found"};
  return {card:r.card,tx};
}

    up.rc={d:r.d,m:r.m,a:r.a,c:guessCat(r.m)||presetCat.tx||"",files:up.files,local:true};

"a" is the final total paid. "c" is the best id from this list, or "":
${catList()}

async function startRead(){
  if(up.busy||!up.files.length) return;
  up.busy=true;up.err="";up.status="Opening the file…";up.ctl=new AbortController();render();
  try{if(up.mode==="st")await runStatement();else await runReceipt()}
  catch(e){if(!(e&&e.code==="cancelled"))up.err=upErr(e)}
  up.busy=false;up.status="";up.ctl=null;render();window.scrollTo({top:0});
}

let purging=false;
async function purgeOld(){
  if(purging||!store) return; purging=true;
  try{for(const s of state.stmt){
    if(!(Date.now()-Date.parse(s.uploaded)>KEEP_MS)) continue;
    if(s.files&&s.files.length&&!assets) continue;
    for(const f of s.files||[]){try{await assets.delete(f.id)}catch{}}
    try{await store.del("stmt",s.id)}catch{}
  }}finally{purging=false}
}

function reconcile(s){
  const from=s.from, to=s.to, lo=addDays(from,-3), hi=addDays(to,3), done=s.done||{};
  const pool=state.tx.filter(t=>t.date>=lo&&t.date<=hi).sort((a,b)=>a.date<b.date?-1:1);
  const used=new Set(), R={ok:[],miss:[],amt:[],extra:[],ref:[]};
  const all=s.tx.map((x,i)=>({...x,i})), pur=all.filter(x=>x.t!=="refund"), left=[];
  for(const x of pur){const m=pool.find(t=>!used.has(t.id)&&Math.abs((+t.amount||0)-x.a)<0.01&&dDiff(t.date,x.d)<=2);if(m){used.add(m.id);R.ok.push({x,t:m})}else left.push(x)}
  for(const x of left){
    const m=pool.filter(t=>!used.has(t.id)&&dDiff(t.date,x.d)<=1&&Math.abs((+t.amount||0)-x.a)<=Math.max(25,x.a*.15)).sort((a,b)=>Math.abs(a.amount-x.a)-Math.abs(b.amount-x.a))[0];
    if(m){used.add(m.id);if(!done["s"+x.i])R.amt.push({x,t:m})}else if(!done["s"+x.i])R.miss.push({x});
  }
  for(const t of pool) if(!used.has(t.id)&&t.date>=from&&t.date<=to&&!done["a"+t.id]) R.extra.push({t});
  for(const x of all.filter(x=>x.t==="refund")) if(!done["s"+x.i]) R.ref.push({x,t:state.tx.find(t=>Math.abs((+t.amount||0)-x.a)<0.01&&t.date<=x.d&&dDiff(t.date,x.d)<=60)});
  R.stTotal=sum(pur,x=>x.a); R.stCount=pur.length;
  const inApp=state.tx.filter(t=>t.date>=from&&t.date<=to); R.appTotal=sum(inApp); R.appCount=inApp.length;
  return R;
}

/* ---------- free on-device reader (no AI): PDF text + photo OCR ---------- */
const OCR={lib:"https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js",worker:"https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js",core:"https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1",lang:"https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int"};
let ocrW=null, ocrProg=null;
async function ocrWorker(){
  if(ocrW) return ocrW;
  if(!window.Tesseract) await loadScript(OCR.lib);
  ocrW=await window.Tesseract.createWorker("eng",1,{workerPath:OCR.worker,corePath:OCR.core,langPath:OCR.lang,logger:m=>{if(ocrProg&&m.status==="recognizing text")ocrProg(m.progress)}});
  return ocrW;
}
async function prepOcr(src){

  if(f.type==="application/pdf") return {blob:f,type:"application/pdf"};
  if(!f.type.startsWith("image/") && !/\.(heic|heif)$/i.test(f.name)) throw {code:"type"};
  if(/^image\/(jpeg|png|webp)$/.test(f.type) && f.size<2.5e6) return {blob:f,type:f.type};
  const bmp=await createImageBitmap(f); const s=Math.min(1,2000/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85)); if(!blob) throw {code:"type"};
  return {blob,type:"image/jpeg"};
}

async function saveInc(cid,patch){
  const docs=incDocs(month,cid), base=docs[0]||{};
  const amount=patch.amount!==undefined?patch.amount:Math.round(sum(docs)*100)/100;
  const note=patch.note!==undefined?patch.note:(base.note||"");
  const attachment=patch.attachment!==undefined?patch.attachment:(docs.find(x=>x.attachment)||{}).attachment;
  if(!(amount>0)&&!note&&!attachment){for(const d of docs) await store.del("inc",d.id); return "cleared"}
  const doc={month,date:base.date||month+"-01",cat:cid,amount:amount>0?amount:0,note,ts:new Date().toISOString()};
  if(attachment) doc.attachment=attachment;
  const id=base.id||`${month}_${cid}`;
  await store.set("inc",id,doc);
  for(const d of docs.slice(1)) await store.del("inc",d.id);
  return "saved";
}

function exportData(){
  const strip=a=>a.map(r=>{const o={...r};delete o.attachment;return o});
  return {app:"household-budget",version:1,region,exported:new Date().toISOString(),cats:{spend:clone(GROUPS),income:clone(IGROUPS)},pots:state.pots||null,tx:strip(state.tx),inc:strip(state.inc),sav:strip(state.sav),merch:state.merch||{}};
}
function mergeGroups(cur,inc){
  const out=clone(cur);
  for(const g of (Array.isArray(inc)?inc:[])){
    if(!g||!g.id||!Array.isArray(g.cats)) continue;
    const e=out.find(x=>x.id===g.id);
    if(!e){out.push(clone(g));continue}
    for(const c of g.cats) if(c&&c.id&&!e.cats.some(x=>x.id===c.id)) e.cats.push(clone(c));
  }
  return out;
}

/* ---------- full backup (html + json) ---------- */
async function appSource(){
  if(HBP&&HBP.appHtml) return HBP.appHtml;
  try{const r=await fetch(location.href,{cache:"no-cache"});if(r.ok){const t=await r.text();if(t.includes('name="hb-app"'))return t}}catch{}
  const root=document.documentElement.cloneNode(true), v=root.querySelector("#view");
  if(v) v.innerHTML="";
  root.querySelectorAll(".toast,.viewer,#hb-backup,script[src]").forEach(n=>n.remove());
  return "<!doctype html>"+root.outerHTML;
}
function withBackup(html,data){
  const tag='<script type="application/json" id="hb-'+'backup">'+JSON.stringify(data).replace(/</g,"\\u003c")+"<\/script>";
  html=html.replace(/<script type="application\/json" id="hb-backup">[\s\S]*?<\/script>/,"");
  return /<\/body>/i.test(html)?html.replace(/<\/body>(?![\s\S]*<\/body>)/i,tag+"</body>"):html+tag;
}
async function loadEmbeddedBackup(){
  const el=document.getElementById("hb-backup"); if(!el) return;
  let d; try{d=JSON.parse(el.textContent)}catch{return}
  if(!d||d.app!=="household-budget") return;
  const sx=(d.region||"AE")==="IN"?"_in":"";
  if(local.read("tx"+sx,[]).length||local.read("inc"+sx,[]).length||local.read("sav"+sx,[]).length) return;
  if((d.region||"AE")!==region){region=d.region||"AE";try{localStorage.setItem("region",region)}catch{}}
  local.write("tx"+sx,d.tx||[]);local.write("inc"+sx,d.inc||[]);local.write("sav"+sx,d.sav||[]);
  if(d.cats) local.write("cats"+sx,{spend:d.cats.spend,income:d.cats.income,mig_salik:true,mig_health:true});
  if(d.pots) local.write("pots"+sx,{pots:d.pots});
  if(d.merch) local.write("merch"+sx,{m:d.merch});
  setTimeout(()=>toast(`Opened your backup from ${String(d.exported||"").slice(0,10)}. Changes here stay on this device.`),600);
}
async function deliverFiles(files){
  let dl=null; if(!HBP){try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch{dl=null}}
  if(dl){for(const f of files){try{await dl.save({filename:f.name,data:await f.text()})}catch(e){if(e&&e.code==="declined")return false;throw e}}return true}
  const fl=files.map(f=>new File([f],f.name,{type:f.type}));
  try{if(navigator.canShare&&navigator.canShare({files:fl})){await navigator.share({files:fl,title:"Household budget backup"});return true}}catch(e){if(e&&e.name==="AbortError")return false}
  for(const f of fl){const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);await new Promise(r=>setTimeout(r,400))}
  return true;
}

    if(ok) toast("Backup saved: open the .html to see everything offline");
  }catch{toast("Couldn't make the backup. Try again.")}
  b.disabled=false; b.textContent=old;
});

/* ---------- account + admin (Firebase version only) ---------- */
const adm={step:null,html:"",name:"",busy:false,err:""};
function renderAdmin(){
  const box=$("#adminBox"); if(!box) return;
  if(!HBP){box.hidden=true;return}
  box.hidden=false;
  const i=HBP.appInfo||{}, u=HBP.user()||{}, g=!!(HBP.usesGoogle&&HBP.usesGoogle());
  const ver=i.source==="uploaded"?`Uploaded version${i.name?" ("+esc(i.name)+")":""} · ${esc(i.by||"")} · ${i.at?new Date(i.at).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):""}`:"GitHub version";
  let h=`<div class="eyebrow" style="margin-top:6px">Account</div>
    <div class="admrow"><span>Signed in as <b>${esc(u.email||"")}</b></span><button type="button" class="btn soft sm" id="admSignOut">Sign out</button></div>
    <div class="eyebrow" style="margin-top:6px">App version · admin</div><div class="note" style="text-align:left">${ver}</div>`;
  if(adm.step==="pw") h+=`<form id="admForm" class="admform"><div class="note" style="text-align:left">Upload <b>${esc(adm.name)}</b> as the new app for both of you.${g?" Tap the button to confirm.":" Enter your password to confirm."}</div>
      ${g?"":`<input type="password" id="admPw" autocomplete="current-password" placeholder="Your password" aria-label="Your password">`}
      ${adm.err?`<div class="uperr">${esc(adm.err)}</div>`:""}
      <div style="display:flex;gap:8px"><button class="btn" type="submit" style="flex:1" ${adm.busy?"disabled":""}>${adm.busy?"Uploading…":"Upload and reload"}</button><button class="btn soft" type="button" id="admCancel">Cancel</button></div></form>`;
  else h+=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn soft sm" id="admPick">⬆️ Upload new app version</button>${i.hasPrev?`<button type="button" class="btn soft sm" id="admUndo">↩️ Undo last upload</button>`:""}${i.source==="uploaded"?`<button type="button" class="btn soft sm" id="admReset">Use GitHub version</button>`:""}</div>
      ${adm.err?`<div class="uperr">${esc(adm.err)}</div>`:""}<input type="file" id="admFile" accept=".html,text/html" hidden>`;
  box.innerHTML=h;
}
$("#syncCard").addEventListener("click",async e=>{
  const t=e.target; if(!HBP) return;
  if(t.closest("#admSignOut")) return HBP.signOut();
  if(t.closest("#admPick")){adm.err="";const f=$("#admFile");f.value="";return f.click()}
  if(t.closest("#admCancel")){adm.step=null;adm.html="";adm.err="";return renderAdmin()}
  if(t.closest("#admUndo")){if(!arm("admUndo",t.closest("#admUndo"),"Undo upload?"))return;try{await HBP.undoApp();HBP.reload()}catch{adm.err="Couldn't undo. Try again.";renderAdmin()}return}
  if(t.closest("#admReset")){if(!arm("admReset",t.closest("#admReset"),"Switch to GitHub version?"))return;try{await HBP.resetApp();HBP.reload()}catch{adm.err="Couldn't switch. Try again.";renderAdmin()}return}
});
$("#syncCard").addEventListener("change",async e=>{
  if(e.target.id!=="admFile") return;
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  if(f.size>900000){adm.err="That file is too large (max 900 KB).";return renderAdmin()}
  const html=await f.text();
  if(!html.includes('name="hb-app" content="household-budget"')){adm.err="That isn't a Household Budget app file.";return renderAdmin()}
  adm.html=html;adm.name=f.name;adm.step="pw";adm.err="";renderAdmin();setTimeout(()=>$("#admPw")&&$("#admPw").focus(),30);
});
$("#syncCard").addEventListener("submit",async e=>{
  if(e.target.id!=="admForm") return; e.preventDefault(); if(adm.busy) return;
  const pwEl=$("#admPw"), pw=pwEl?pwEl.value:""; if(pwEl&&!pw){adm.err="Enter your password.";return renderAdmin()}
  adm.busy=true;adm.err="";renderAdmin();
  try{await HBP.reauth(pw)}catch{adm.busy=false;adm.err="That password isn't right.";return renderAdmin()}
  try{await HBP.saveApp(adm.html,adm.name);adm.busy=false;adm.step=null;toast("New version uploaded. Reloading…");setTimeout(()=>HBP.reload(),800)}
  catch{adm.busy=false;adm.err="Couldn't upload. Check your connection and try again.";renderAdmin()}
});
renderAdmin();

/* ---------- boot ---------- */
render();
(async()=>{
  if(HBP){store=makeDbStore(HBP.db);assets=makeFsAssets(HBP.db);start();render();return}
  for(let i=0;i<20&&!(window.claude&&window.claude.use);i++) await new Promise(r=>setTimeout(r,100));
  let db=null; try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch{db=null}
  store=db?makeDbStore(db):makeLocalStore();
  if(!db) await loadEmbeddedBackup();
  start();
  if(db){try{assets=await window.claude.use("assets")}catch{assets=null} if(assets){render();purgeOld()}}
  try{sampleFn=window.claude&&window.claude.use?await window.claude.use("sample"):null}catch{sampleFn=null}
  if(sampleFn){try{const l=await sampleFn.limits();up.maxImgs=(l.images&&l.images.maxCount)||0}catch{up.maxImgs=0}}
  render();
})();
</script>
