<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a2cf2">
<title>Finance Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--h1:#b14cf5;--h2:#7a2cf2;--ink:#1b1530;--muted:#8a8597;--line:#ebe8f2;--bg:#f3f2f8;--surface:#fff;--surface-2:#f1eff7;--bad:#e5484d;--font:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root{--ink:#f1edf8;--muted:#a29cb2;--line:#2e2840;--bg:#121019;--surface:#1c1826;--surface-2:#262133}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
.gate{min-height:100%;display:flex;flex-direction:column}
.top{background:linear-gradient(160deg,var(--h1),var(--h2));color:#fff;padding:calc(36px + env(safe-area-inset-top,0px)) 24px 70px;text-align:center}
.top b{display:block;font-size:1.5rem;font-weight:800}
.top span{opacity:.9}
.card{background:var(--surface);border-radius:22px;padding:20px;margin:-46px 16px 24px;max-width:420px;align-self:center;width:calc(100% - 32px);display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(40,20,80,.06)}
label{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
input{width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:12px;font:500 1rem var(--font)}
button{font-family:inherit;cursor:pointer}
.btn{border:0;background:linear-gradient(160deg,var(--h1),var(--h2));color:#fff;font-weight:700;font-size:1rem;padding:13px;border-radius:14px;width:100%}
.btn[disabled]{opacity:.6}
.link{border:0;background:transparent;color:var(--h2);font-weight:700;font-size:.92rem;padding:6px 0}
.msg{border-radius:12px;padding:10px 12px;font-size:.9rem;font-weight:600}
.msg.err{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.msg.ok{background:color-mix(in srgb,#2ec4a0 16%,transparent);color:color-mix(in srgb,#2ec4a0 60%,var(--ink))}
.note{font-size:.82rem;color:var(--muted);text-align:center}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--h2);margin:40px auto;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="top"><b>Finance Tracker</b><span>Private · approved accounts only</span></div>
  <div class="card" id="card"><div class="spin" aria-label="Loading"></div></div>
</div>
<iframe id="app" title="Finance Tracker" allow="web-share; clipboard-write" hidden></iframe>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
  const $=s=>document.querySelector(s), card=$("#card");
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const ALLOWED=["beulahsteephen@gmail.com","emailsamuelvk@gmail.com"];
  const cfg=window.HB_FIREBASE;
  if(!cfg||!cfg.apiKey||/PASTE/.test(cfg.apiKey)){card.innerHTML=`<div class="msg err">Setup isn't finished.</div>`;return}
  firebase.initializeApp(cfg);
  const auth=firebase.auth(), db=firebase.firestore();
  db.settings({ignoreUndefinedProperties:true,merge:true});
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  let note="", busy=false, appInfo={}, up="";
  // Front-door check only. The real lock is the Firestore rule, enforced on Google's servers.
  const okUser=u=>!!u&&u.emailVerified===true&&ALLOWED.includes(String(u.email||"").toLowerCase())&&u.providerData.some(p=>p.providerId==="google.com");

  function showLogin(){
    card.innerHTML=`<button class="btn" id="gg" ${busy?"disabled":""}>Sign in with Google</button>
      ${note?`<div class="msg err">${esc(note)}</div>`:""}
      <div class="note">Only the two approved Google accounts can open this.</div>`;
  }
  card.addEventListener("click",async e=>{
    if(e.target.id==="gg"){
      if(busy) return; busy=true; note=""; showLogin();
      try{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});await auth.signInWithPopup(p)}
      catch(err){const c=err&&err.code;if(c!=="auth/popup-closed-by-user"&&c!=="auth/cancelled-popup-request")note="Google sign-in didn't work. Allow pop-ups for this site and try again."}
      busy=false; if(!auth.currentUser) showLogin();
    }
    if(e.target.id==="out"){await auth.signOut()}
    if(e.target.id==="retry"){loadApp()}
  });
  card.addEventListener("change",async e=>{
    if(e.target.id!=="upf") return;
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    if(f.size>900000){up="That file is too large (max 900 KB).";return showUpload()}
    const html=await f.text();
    if(!html.includes('name="hb-app" content="household-budget"')){up="That isn't a Finance Tracker app file.";return showUpload()}
    card.innerHTML=`<div class="spin" aria-label="Uploading"></div>`;
    try{await window.HB.saveApp(html,f.name);location.reload()}catch{up="Couldn't upload. Check your connection and try again.";showUpload()}
  });
  function showUpload(){
    card.innerHTML=`<div class="note" style="color:var(--ink)">Welcome. Choose the Finance Tracker app file (.html) to install it.</div>
      ${up?`<div class="msg err">${esc(up)}</div>`:""}
      <input id="upf" type="file" accept=".html,text/html">
      <button class="link" id="out">Sign out</button>`;
  }
  async function loadApp(){
    card.innerHTML=`<div class="spin" aria-label="Loading"></div>`;
    let d=null, hasPrev=false;
    try{const s=await db.doc("app/current").get();d=s.exists?s.data():null}
    catch(err){
      if(err&&err.code==="permission-denied"){note="This account isn't allowed to open Finance Tracker.";await auth.signOut();return}
      card.innerHTML=`<div class="msg err">Couldn't load. Check your connection.</div><button class="btn" id="retry">Try again</button>`;return;
    }
    try{hasPrev=(await db.doc("app/previous").get()).exists}catch{}
    if(!(d&&d.html)){showUpload();return}
    appInfo={source:"uploaded",by:d.by,at:d.at,name:d.name,hasPrev};
    window.HB.appHtml=d.html; window.HB.appInfo=appInfo;
    const f=$("#app"); f.srcdoc=d.html; f.hidden=false; $("#gate").hidden=true;
  }
  function gateUser(u){
    if(!u){$("#app").hidden=true;$("#app").srcdoc="";$("#gate").hidden=false;busy=false;showLogin();return}
    if(!okUser(u)){note="This Google account isn't approved for Finance Tracker.";auth.signOut();return}
    loadApp();
  }
  window.HB={db,
    user:()=>auth.currentUser,
    signOut:()=>auth.signOut(),
    usesGoogle:()=>true,
    reauth:()=>Promise.resolve(),
    async saveApp(html,name){
      const u=auth.currentUser; if(!okUser(u)) throw new Error("not allowed");
      const cur=await db.doc("app/current").get(), batch=db.batch();
      if(cur.exists) batch.set(db.doc("app/previous"),cur.data());
      batch.set(db.doc("app/current"),{html,name:String(name||"").slice(0,80),by:u.email,at:new Date().toISOString(),size:html.length});
      await batch.commit();
    },
    async undoApp(){const p=await db.doc("app/previous").get();if(!p.exists)throw new Error("none");const b=db.batch();b.set(db.doc("app/current"),p.data());b.delete(db.doc("app/previous"));await b.commit()},
    async resetApp(){const cur=await db.doc("app/current").get();const b=db.batch();if(cur.exists)b.set(db.doc("app/previous"),cur.data());b.delete(db.doc("app/current"));await b.commit()},
    reload:()=>location.reload(),
    appHtml:"", appInfo:{}
  };
  auth.onAuthStateChanged(gateUser);
})();
</script>
</body>
</html>
